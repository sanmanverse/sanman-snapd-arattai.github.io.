<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanman Tiwari — Full-Stack Developer, Ethical Hacker, Magician, Founder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--fg:#2b0f17;--mut:#715a61;--line:#efe3e5;--card:#fff;--acc:#8a6a2a;--pri:#6d1426;--hc:#6d1426;--ib:#5a1022;--if:#fbf6f4;--il:rgba(251,246,244,.28);--ia:#e0bd72;--serif:"Cormorant Garamond",Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0910;--fg:#f6eeee;--mut:#c4a9b0;--line:#43202b;--card:#26101a;--acc:#e0bd72;--pri:#8e1f38;--hc:#f3d3da;--ib:#3b0f1d;--if:#f6eeee}}
:root[data-theme="dark"]{--bg:#1a0910;--fg:#f6eeee;--mut:#c4a9b0;--line:#43202b;--card:#26101a;--acc:#e0bd72;--pri:#8e1f38;--hc:#f3d3da;--ib:#3b0f1d;--if:#f6eeee}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Manrope",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
h1,h2,h3{font-family:var(--serif);font-weight:500}
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 15% 0%,#5a1022 0,#1a0910 62%);color:#f6eeee;display:flex;flex-direction:column;transition:opacity .8s,visibility .8s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#intro.done{opacity:0;visibility:hidden}
.itop{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;font-family:var(--serif);font-size:22px;font-weight:600}
.itop button{background:none;border:1px solid rgba(217,182,111,.5);color:#f6eeee;border-radius:99px;padding:7px 18px;font:inherit;font-family:"Manrope",sans-serif;font-size:13px;cursor:pointer}
.itop button:hover{background:#d9b66f;color:#1a0910}
.stage{flex:1;display:grid;place-items:center;padding:0 28px;min-height:0}
.slide{display:none;width:100%;max-width:980px;grid-template-columns:minmax(0,320px) 1fr;gap:clamp(28px,7vw,88px);align-items:center}
.slide.on{display:grid}
.frame{position:relative;aspect-ratio:4/5;border-radius:999px 999px 10px 10px;overflow:hidden;background:#1a0910;outline:1px solid #d9b66f;outline-offset:8px}
.frame img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block;filter:blur(22px) grayscale(1) brightness(.5);transform:scale(1.15);transition:filter 1.3s ease,transform 1.3s ease}
.frame.open img{filter:none;transform:none}
.pad{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .5s .6s}
.frame.open .pad{opacity:0}
.pad svg{width:56px;height:56px}
.pad svg *{stroke:#d9b66f}.pad svg circle{fill:#d9b66f}
.pad .sh{transition:transform .4s;transform-origin:50% 100%}
.frame.open .pad .sh{transform:translateY(-4px) rotate(-30deg)}
.badge{position:absolute;right:50%;margin-right:-22px;bottom:14px;width:44px;height:44px;border-radius:50%;background:#1a0910;border:1px solid #d9b66f;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:all .5s 1.4s}
.frame.open .badge{opacity:1;transform:none}
.badge svg{width:22px;height:22px}.badge svg *{stroke:#d9b66f}
.txt .k{color:#d9b66f;font-size:15px;margin:0 0 12px;min-height:1.7em;font-style:italic;font-family:var(--serif);font-size:20px}
.txt h2{font-size:clamp(40px,8vw,88px);line-height:.98;margin:0 0 20px;letter-spacing:-.01em;word-break:break-word}
.txt p{color:#d8c2c7;margin:0;max-width:34ch;font-size:clamp(16px,2.1vw,19px)}
.ch{display:inline-block}.ch.s{color:#9a6b78}
.ibot{padding:0 28px 30px;display:flex;align-items:center;gap:16px}
.dots{display:flex;gap:8px;flex:1}
.dots i{flex:1;max-width:80px;height:2px;background:#4a1a28;position:relative;overflow:hidden}

  h+='<section id="venture"><div class="wrap vgrid"><div><h2>Founder, '+E(D.vName)+'</h2><p class="vtag">'+E(D.vTag)+'</p>'+vab.map(function(p){return'<p>'+E(p)+'</p>'}).join('')+(D.vLink?'<a class="btn fill" href="'+E(safe(D.vLink))+'" target="_blank" rel="noopener">Visit '+E(D.vName)+'</a>':'')+'</div><dl class="facts">'+ft.map(function(r){return'<div><dt>'+E(r[0])+'</dt><dd>'+E(r[1]||'')+'</dd></div>'}).join('')+'</dl></div></section>';
  h+='<section id="work"><div class="wrap"><h2>Selected work</h2><div class="projects">'+pr.map(function(r){return'<article class="card"><h3>'+E(r[0])+'</h3><p>'+E(r[1]||'')+'</p><div class="tags">'+E(r[2]||'')+'</div></article>'}).join('')+'</div></div></section>';
  if((D.gallery||[]).length)h+='<section id="moments"><div class="wrap"><h2>Moments</h2><div class="gal">'+D.gallery.map(function(g){return'<figure><img src="'+E(g.img)+'" alt="'+E(g.t||'')+'" loading="lazy"><figcaption><b>'+E(g.t||'')+'</b><span>'+E(g.c||'')+'</span></figcaption></figure>'}).join('')+'</div></div></section>';
  h+='<section id="magic" class="inv"><div class="wrap magic"><div><h2>Pick a card. I’ll read your mind.</h2><p>A small trick, right here.</p></div><div class="pick"><p>Think of one card, then tap any to reveal your fate.</p><div class="cards" id="cards"></div><div id="out" aria-live="polite"></div></div></div></section>';
  h+='<section id="contact"><div class="wrap"><h2>Let’s build, secure or perform something.</h2><a class="big" href="mailto:'+E(D.email)+'">'+E(D.email)+'</a><div class="links">'+ln.map(function(r){return'<a href="'+E(safe(r[1]||'#'))+'" target="_blank" rel="noopener">'+E(r[0])+'</a>'}).join('')+'</div></div></section></main><footer><div class="wrap">© '+new Date().getFullYear()+' '+E(D.name)+'</div></footer>';
  app.innerHTML=h;
  document.getElementById('theme').onclick=function(){var d=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;root.setAttribute('data-theme',d?'light':'dark')};
  var box=document.getElementById('cards'),out=document.getElementById('out');
  CARDS.forEach(function(c){var b=document.createElement('button');b.className='pc';b.textContent='?';b.setAttribute('aria-label','Face-down card');b.onclick=function(){[].forEach.call(box.children,function(o){o.classList.remove('up');o.textContent='?'});b.textContent=c;b.classList.add('up');out.textContent=LINES[Math.random()*LINES.length|0]};box.appendChild(b)});
  startIntro(slides);
}

var G='!<>-_\\/[]{}=+*^?#01',sid=0,timer,cur=-1,DUR=4600;
function scramble(el,text,delay){
  el.innerHTML='';var id=++sid,sp=[].map.call(text,function(c){var s=document.createElement('span');s.className='ch s';s.textContent=' ';el.appendChild(s);return s}),t0=performance.now()+delay;
  (function tick(t){if(id!==sid)return;var n=0;sp.forEach(function(s,i){var ch=text[i]===' '?'\u00a0':text[i],at=t0+i*55;if(t>=at+260){s.textContent=ch;s.className='ch';n++}else if(t>=t0){s.textContent=G[Math.random()*G.length|0]}});if(n<sp.length)requestAnimationFrame(tick)})(performance.now());
}
function startIntro(slides){
  var intro=document.getElementById('intro'),stage=document.getElementById('stage'),dots=document.getElementById('dots'),count=document.getElementById('count');
  function enter(){clearTimeout(timer);sid++;intro.classList.add('done');document.body.classList.remove('noscroll');try{sessionStorage.setItem('seen','1')}catch(e){}window.scrollTo(0,0)}
  function show(n){
    clearTimeout(timer);if(n>=slides.length){enter();return}if(n<0)n=0;cur=n;
    for(var i=0;i<stage.children.length;i++){stage.children[i].classList.toggle('on',i===n);stage.children[i].querySelector('.frame').classList.remove('open');dots.children[i].className=i<n?'past':(i===n?'cur':'')}
    count.textContent=(n+1)+' / '+slides.length;
    var cs=stage.children[n],fr=cs.querySelector('.frame'),k=cs.querySelector('.k');k.textContent='';
    setTimeout(function(){if(cur===n)fr.classList.add('open')},500);
    scramble(cs.querySelector('h2'),slides[n][0],350);
    setTimeout(function(){if(cur===n)k.textContent=KS[n%KS.length]},1500);
    timer=setTimeout(function(){show(n+1)},DUR);
  }
  document.getElementById('skip').onclick=enter;
  intro.onclick=function(e){if(!e.target.closest('#skip'))show(cur+1)};
  intro.ontouchstart=function(e){intro._x=e.touches[0].clientX};
  intro.ontouchend=function(e){if(intro._x==null)return;var d=e.changedTouches[0].clientX-intro._x;intro._x=null;if(Math.abs(d)>50){e.preventDefault();show(d<0?cur+1:cur-1)}};
  document.onkeydown=function(e){if(intro.classList.contains('done'))return;if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);if(e.key==='Escape')enter()};
  var seen=false;try{seen=sessionStorage.getItem('seen')==='1'}catch(e){}
  if(seen||!slides.length){intro.classList.add('done');document.body.classList.remove('noscroll')}else show(0);
}

/* owner editor */
var F=[['name','Your name','text'],['roles','Roles (comma separated)','text'],['tagline','Intro line under your name','area'],['about','About me (blank line between paragraphs)','area'],['slides','Opening slides (one per line: Title | caption)','area'],['skills','Skills (one per line: Title | description | tag, tag, tag)','area'],['projects','Work (one per line: Title | description | tags)','area'],['vName','Venture name','text'],['vTag','Venture tagline','text'],['vAbout','About the venture (blank line between paragraphs)','area'],['vFacts','Venture facts (one per line: Label | value)','area'],['vLink','Venture website (optional)','text'],['email','Email','text'],['links','Social links (one per line: Name | https://link)','area']];
function msg(t){var m=document.getElementById('msg');if(m)m.textContent=t}
function collect(){F.forEach(function(f){var v=document.getElementById('f_'+f[0]).value;D[f[0]]=f[2]==='text'?v.trim():v})}
async function buildHtml(){
  var c=root.cloneNode(true);c.removeAttribute('data-theme');c.removeAttribute('style');
  c.querySelector('#app').innerHTML='';var ed=c.querySelector('#ed');if(ed)ed.remove();
  c.querySelector('body').className='noscroll';
  c.querySelector('#site-data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
async function cap(n){try{return window.claude&&window.claude.use?await window.claude.use(n):null}catch(e){return null}}
async function save(){
  collect();var a=await cap('artifact');
  if(!a){msg('Publishing works only inside Claude. Use Download to get the updated file.');return}
  msg('Publishing…');
  try{await a.publish(await buildHtml())}catch(e){msg(e&&e.code==='not_writer'||e&&e.code==='not_granted'?'This view is read-only.':'Could not publish ('+(e&&e.code||'error')+').')}
}
async function download(){
  collect();var html=await buildHtml(),d=await cap('downloads');
  if(d){try{await d.save({filename:'index.html',data:html});msg('File ready.')}catch(e){msg('Download was cancelled.')}}
  else{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';a.click();msg('File downloaded.')}
}
function buildEditor(){
  var ed=document.createElement('div');ed.id='ed';
  var h='<button id="fab">Edit site</button><aside id="panel" hidden aria-label="Edit site"><div class="ph"><h3>Edit your site</h3><button id="pc2">Close</button></div><div class="pb"><label>Your photo</label><img id="prev" src="'+E(D.photo)+'" alt=""><input type="file" id="fphoto" accept="image/*"><label>Gallery photos</label><div id="gal"></div><button type="button" class="sm" id="gadd">Add photo</button><input type="file" id="gfile" accept="image/*" hidden>';
  F.forEach(function(f){h+='<label for="f_'+f[0]+'">'+f[1]+'</label>'+(f[2]==='area'?'<textarea id="f_'+f[0]+'"></textarea>':'<input type="text" id="f_'+f[0]+'">')});
  h+='</div><div class="pf"><button class="p" id="bsave">Save &amp; publish</button><button id="bprev">Preview</button><button id="bdl">Download file</button><p id="msg"></p></div></aside>';
  ed.innerHTML=h;document.body.appendChild(ed);
  F.forEach(function(f){document.getElementById('f_'+f[0]).value=D[f[0]]});
  var p=document.getElementById('panel');
  document.getElementById('fab').onclick=function(){p.hidden=false};
  document.getElementById('pc2').onclick=function(){p.hidden=true};
  document.getElementById('bsave').onclick=save;
  document.getElementById('bdl').onclick=download;
  document.getElementById('bprev').onclick=function(){collect();render();var i=document.getElementById('intro');i.classList.add('done');document.body.classList.remove('noscroll');msg('Previewing. Save & publish to keep it.')};
  var gt=-1,gf=document.getElementById('gfile');
  function shrink(file,max,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)}
  function drawGal(){var g=document.getElementById('gal');g.innerHTML='';D.gallery=D.gallery||[];D.gallery.forEach(function(it,i){var d=document.createElement('div');d.className='gi';d.innerHTML='<img alt=""><div><input type="text" placeholder="Title" aria-label="Title"><input type="text" placeholder="Caption" aria-label="Caption"><button type="button" class="sm">Replace</button> <button type="button" class="sm">Remove</button></div>';d.querySelector('img').src=it.img;var ins=d.querySelectorAll('input'),bs=d.querySelectorAll('button');ins[0].value=it.t||'';ins[1].value=it.c||'';ins[0].oninput=function(){it.t=this.value};ins[1].oninput=function(){it.c=this.value};bs[0].onclick=function(){gt=i;gf.click()};bs[1].onclick=function(){D.gallery.splice(i,1);drawGal()};g.appendChild(d)})}
  gf.onchange=function(){var fl=this.files[0];this.value='';if(!fl)return;shrink(fl,900,function(u){if(gt>=0)D.gallery[gt].img=u;else D.gallery.push({img:u,t:'',c:''});drawGal()})};
  document.getElementById('gadd').onclick=function(){gt=-1;gf.click()};
  drawGal();
  document.getElementById('fphoto').onchange=function(){
    var f=this.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.photo=c.toDataURL('image/jpeg',.82);document.getElementById('prev').src=D.photo;msg('Photo added. Tap Preview or Save.')};im.src=r.result};
    r.readAsDataURL(f);
  };
}
async function initEditor(){
  var ok=false,u=await cap('user');
  if(u){try{ok=!!(u.isOwner()||u.canEdit())}catch(e){}}
  else if(!(window.claude&&window.claude.use)&&location.hash==='#edit')ok=true;
  if(ok&&!document.getElementById('ed'))buildEditor();
}
render();initEditor();
})();
